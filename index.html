<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f1">
<title>おとりえ｜音楽と積木のサロン</title>
<meta name="description" content="東高円寺駅徒歩5分。ピアノ・オルガン・ボイストレーニング・積木ワークショップ。音楽と積木のサロン おとりえ。">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eee8df}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.shell{width:min(100%,941px);margin:0 auto;background:#fbf7f1;box-shadow:0 18px 60px rgba(60,42,30,.13)}
iframe{display:block;width:100%;height:1672px;border:0;background:#fbf7f1;overflow:hidden}
@media(min-width:942px){body{padding:24px 0}.shell{border-radius:18px;overflow:hidden}}
@media(max-width:520px){html,body{background:#fbf7f1}.shell{box-shadow:none}}
</style>
</head>
<body>
<div class="shell"><iframe id="topFrame" src="otorie_exact_demo.html" title="おとりえ"></iframe></div>
<script>
const frame=document.getElementById('topFrame');
function installLinks(){
  try{
    const d=frame.contentDocument;
    if(!d)return;
    const st=d.createElement('style');
    st.textContent=`
      html,body{padding:0!important;background:#fbf7f1!important}
      .site{border-radius:0!important}
      .course-piano{left:4.0%;top:58.0%;width:21.0%;height:11.8%;border-radius:22px}
      .course-organ{left:26.7%;top:58.0%;width:21.0%;height:11.8%;border-radius:22px}
      .course-voice{left:49.0%;top:58.0%;width:21.0%;height:11.8%;border-radius:22px}
      .course-tsumiki{left:71.7%;top:58.0%;width:21.0%;height:11.8%;border-radius:22px}
    `;
    d.head.appendChild(st);
    const main=d.querySelector('.site');
    const add=(cls,href,label)=>{
      if(d.querySelector('.'+cls))return;
      const a=d.createElement('a');
      a.className='hit '+cls;
      a.href=href;
      a.setAttribute('aria-label',label);
      const s=d.createElement('span');
      s.className='sr';
      s.textContent=label;
      a.appendChild(s);
      main.appendChild(a);
    };
    add('course-piano','music/','ピアノコースの詳しいご案内');
    add('course-organ','music/','オルガンコースの詳しいご案内');
    add('course-voice','voice/','ボイストレーニングの詳しいご案内');
    add('course-tsumiki','tsumiki/','積木ワークショップの詳しいご案内');
    const blocks=d.querySelector('.blocks-detail');
    if(blocks){blocks.href='tsumiki/';blocks.setAttribute('aria-label','積木ワークショップの詳しいご案内')}
    const resize=()=>{frame.style.height=d.documentElement.scrollHeight+'px'};
    resize();
    if(window.ResizeObserver)new ResizeObserver(resize).observe(d.documentElement);
  }catch(e){}
}
frame.addEventListener('load',installLinks);
</script>
</body>
</html>
