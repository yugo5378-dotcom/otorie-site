<!DOCTYPE html>

<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>おとりえ｜トップ修正版プレビュー</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eee8df}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#4a382d}
.site{width:min(100%,941px);margin:0 auto;background:#fbf7f1;box-shadow:0 18px 60px rgba(60,42,30,.13);overflow:hidden}
.upper,.footer{display:block;width:100%;height:auto}
.course-zone{padding:18px 36px 30px;background:#fbf7f1}
.course-title{display:flex;align-items:center;gap:14px;margin:0 0 22px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:29px;letter-spacing:.09em;justify-content:center;color:#5a4437}
.course-title:before,.course-title:after{content:"";height:1px;background:#e8d8c9;flex:1}
.course-block{display:grid;grid-template-columns:42% 58%;min-height:205px;border:1px solid #ead8c8;border-radius:28px;overflow:hidden;margin:0 0 17px;background:#fffaf5;text-decoration:none;color:inherit;position:relative}
.course-block:nth-of-type(even){grid-template-columns:58% 42%}
.course-block:nth-of-type(even) .copy{order:2}
.course-block:nth-of-type(even) .visual{order:1}
.copy{padding:28px 26px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.copy h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:31px;font-weight:500;margin:0 0 10px;line-height:1.25;letter-spacing:.03em}
.copy h2.long-title{font-size:27px;letter-spacing:.015em;white-space:nowrap}
.copy h2.voice-title{font-size:26px}
.copy h2.tsumiki-title{font-size:25px}
.copy p{font-size:14px;line-height:1.8;margin:0 0 16px;color:#67594f}
.more{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:132px;height:42px;padding:0 19px;border-radius:999px;background:#4f9089;color:white;font-weight:700;letter-spacing:.08em;font-size:14px}
.more:after{content:'›';margin-left:.5em;font-size:1.3em;line-height:1}
.visual{position:relative;min-height:205px;overflow:hidden;background:#eee6da}
.visual img{width:100%;height:100%;object-fit:contain;display:block;background:#f4eee5;padding:8px}
.visual:before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);pointer-events:none}
.block-piano .visual img{object-position:center}
.block-organ .visual img{object-position:center}
.block-voice .visual img{object-position:center}
.block-tsumiki .visual img{object-position:center}
.note{position:absolute;font-size:28px;color:#c9976f;opacity:.55;right:18px;bottom:14px}
.footer-wrap{position:relative}
.footer-hit{position:absolute;display:block;background:transparent;border-radius:999px}
.f-trial{left:56%;top:18%;width:37%;height:58%}
@media(min-width:942px){body{padding:24px 0}.site{border-radius:18px}}
@media(max-width:620px){
 .course-zone{padding:12px 18px 24px} .course-title{font-size:23px}
 .course-block,.course-block:nth-of-type(even){grid-template-columns:46% 54%;min-height:168px}
 .copy{padding:18px 15px} .copy h2{font-size:22px} .copy h2.long-title{font-size:18px;white-space:nowrap;letter-spacing:0} .copy h2.voice-title{font-size:18px} .copy h2.tsumiki-title{font-size:17px} .copy p{font-size:12px;line-height:1.65;margin-bottom:12px} .more{height:36px;min-width:108px;font-size:12px;padding:0 14px}
 .visual{min-height:180px}
}

.access-link-wrap{padding:6px 36px 28px;text-align:center;background:#fbf7f1}
.access-link{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:220px;height:50px;padding:0 26px;border:1px solid #d8c4b4;border-radius:999px;background:#fffaf5;color:#4f756f;text-decoration:none;font-weight:700;letter-spacing:.09em;box-shadow:0 6px 16px rgba(83,63,48,.06)}
.access-link span{font-size:12px;font-weight:500;letter-spacing:.05em;color:#7f7066}
@media(max-width:620px){.access-link-wrap{padding:2px 18px 22px}.access-link{min-width:200px;height:46px;font-size:14px}}
</style></head><body><main class="site">
<img alt="おとりえトップページ上部" class="upper" id="topImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="/>
<section class="course-zone">
<a class="course-block block-piano" href="/music/">
<div class="copy"><h2>ピアノ</h2><p>基礎から丁寧に。クラシックからポップスまで、一人ひとりのペースに合わせて。</p><span class="more">詳しく見る</span><span class="note">♪</span></div>
<div class="visual"><img alt="ピアノ" id="pianoImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="/></div>
</a>
<a class="course-block block-organ" href="/music/">
<div class="copy"><h2>オルガン</h2><p>やさしい音色で表現力を広げましょう。個人レッスンでじっくり学べます。</p><span class="more">詳しく見る</span><span class="note">♫</span></div>
<div class="visual"><img alt="オルガン" id="organImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="/></div>
</a>
<a class="course-block block-voice" href="/voice/">
<div class="copy"><h2 class="long-title voice-title">ボイストレーニング</h2><p>呼吸や発声を整えて、自分らしい声へ。子どもから大人まで楽しくレッスン。</p><span class="more">詳しく見る</span><span class="note">♩</span></div>
<div class="visual"><img alt="ボイストレーニング" id="voiceImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="/></div>
</a>
<a class="course-block block-tsumiki" href="/tsumiki/">
<div class="copy"><h2 class="long-title tsumiki-title">積木ワークショップ</h2><p>手を動かしながら、想像力と集中力を育てる時間。親子でゆったり楽しめます。</p><span class="more">詳しく見る</span></div>
<div class="visual"><img alt="積木ワークショップ" id="tsumikiImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="/></div>
</a>
</section>
<div class="access-link-wrap"><a class="access-link" href="/access/">ACCESS <span>東高円寺駅 徒歩5分</span></a></div>
<div class="footer-wrap"><img alt="住所・お問い合わせ" class="footer" src="/assets/footer.webp"/><a aria-label="体験・お問い合わせ" class="footer-hit f-trial" href="mailto:otorie2023@gmail.com"></a></div>
</main><script>
(async function(){
const files={topImg:'/assets/exact-top.webp.b64.txt?v=3',pianoImg:'/assets/exact-piano.webp.b64.txt?v=3',organImg:'/assets/exact-organ.webp.b64.txt?v=3',voiceImg:'/assets/exact-voice.webp.b64.txt?v=3',tsumikiImg:'/assets/exact-tsumiki.webp.b64.txt?v=3'};
for(const [id,url] of Object.entries(files)){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));const b=(await r.text()).trim();document.getElementById(id).src='data:image/webp;base64,'+b;}catch(e){console.error('image load failed',id,e);}}
})();
</script></body></html>
