<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee8df;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif}
.page{width:min(100%,760px);margin:0 auto;padding:18px}
.poster-wrap{position:relative;width:min(100%,500px);margin:0 auto;background:#fbf7f1;border-radius:26px;box-shadow:0 18px 60px rgba(60,42,30,.13);overflow:hidden}
.poster{display:block;width:100%;height:auto}
.back-hit{position:absolute;right:6.4%;top:2.3%;width:26%;height:5.2%;border-radius:999px;background:transparent;-webkit-tap-highlight-color:transparent}
.logo-hit{position:absolute;left:4%;top:1.6%;width:22%;height:8%;border-radius:12px;background:transparent;-webkit-tap-highlight-color:transparent}
.bottom-cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px auto 0;max-width:500px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:800}
.btn.primary{background:#e27a60;color:#fff}
.btn.secondary{background:#f0e7dc;color:#5e5048}
.btn:focus-visible,.back-hit:focus-visible,.logo-hit:focus-visible{outline:3px solid #2f7f80;outline-offset:3px}
@media(min-width:761px){body{padding:24px 0}}
@media(max-width:520px){.page{padding:0} .poster-wrap{border-radius:0;box-shadow:none} .bottom-cta{padding:0 14px 22px} }
</style>
